name: Build SIXERC

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sixerc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SIXERC
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/Release/SIXERC.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Expected executable was not produced: $exe"
            exit 1
          }

          $item = Get-Item $exe

          if ($item.Length -lt 10240) {
            Write-Error "Executable is unexpectedly small."
            exit 1
          }

          Write-Host "Executable: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

      - name: Upload downloadable executable
        uses: actions/upload-artifact@v4
        with:
          name: SIXERC-Windows-x64
          path: build/Release/SIXERC.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SIXERC ${{ github.ref_name }}"
          generate_release_notes: true
          files: build/Release/SIXERC.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}